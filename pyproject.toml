[project]
name = "ea-assistant"
version = "0.1.0"
description = "Local-only meeting Recording to Transcript, Summary and MoM"
readme = "README.md"
authors = [{ name = "msha3ban", email = "mostafa.a.shaban@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ea = "ea_assistant.cli:main"

[project.optional-dependencies]
stt = [
    # Verified on GTX 1060 (Pascal, cc 6.1): effective compute type int8_float32.
    # Newer cuDNN releases may drop Pascal; change these pins only after `ea preflight` passes.
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.3.1", "pytest>=9.1.1", "ruff>=0.16.10"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not accuracy'"
markers = ["accuracy: opt-in real local model accuracy suite"]
